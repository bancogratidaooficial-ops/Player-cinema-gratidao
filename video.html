<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V86 Player TV</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:10px}
.top{background:#111;padding:12px;border-radius:12px;margin-bottom:10px}
.top a{color:#FFD700;text-decoration:none;font-weight:bold}
.busca{display:flex;gap:8px;margin-bottom:10px}
.busca input{flex:1;padding:12px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff}
.card{border:2px solid #FFD700;border-radius:15px;padding:10px;background:#111}
#nome{color:#FFD700;font-weight:bold;margin:10px 0;font-size:16px}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0}
.btns button{padding:12px 20px;border-radius:10px;border:none;background:#FFD700;font-weight:bold}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:8px;max-height:400px;overflow:auto}
.item{padding:10px;border-radius:8px;margin-bottom:5px;background:#222;cursor:pointer;font-size:14px}
.item.ativo{background:#FFD700;color:#000;font-weight:bold}
.green{background:#00d26a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:bold;width:100%;margin-top:8px}
#btnTV{position:fixed;top:10px;right:10px;z-index:9999;background:#FF0000;color:#fff;border:none;padding:14px 20px;border-radius:50px;font-weight:900;box-shadow:0 4px 15px #000}
</style></head>
<body>

<button id="btnTV">📺 JOGAR NA TV</button>
<div class="top"><a href="index.html">🎵 V86 - Player Filmes</a></div>
<div class="busca"><input type="text" id="q" placeholder="Buscar filme... ex: vingadores" onkeydown="if(event.key==='Enter')buscar()"><button onclick="buscar()" style="background:#FFD700;border:none;border-radius:10px;padding:0 15px;font-weight:bold">🔍</button></div>

<div class="card">
<div style="position:relative;width:100%;padding-top:56%;background:#000;border-radius:12px;overflow:hidden">
<iframe id="player" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allow="autoplay; fullscreen" allowfullscreen></iframe>
</div>
<div id="nome">🔴 FILME COMPLETO - Digite um filme e clique na lupa</div>
<div class="btns"><button onclick="ant()">⏮️</button><button onclick="pp()">⏯️</button><button onclick="prox()">⏭️</button></div>
<div class="lista" id="lista"></div>
</div>

<button class="green" onclick="addLink()">➕ Adicionar Link</button>
<button class="green" style="background:#FFD700;color:#000" onclick="document.getElementById('file').click()">📁 Carregar Arquivo</button>
<input type="file" id="file" style="display:none" accept=".txt,.json">

<script>
// --- CAST MÁGICO ---
document.getElementById('btnTV').onclick=async()=>{
  try{
    if(!('PresentationRequest' in window)) return alert('Abre no Chrome!');
    const req=new PresentationRequest([location.href]);
    await req.start();
    document.getElementById('btnTV').innerText='🔴 NA TV';
  }catch(e){alert('Instala AirScreen na TV Box e deixa na mesma Wi-Fi');}
};

let videos=[], idx=0;
const player=document.getElementById('player'), nomeEl=document.getElementById('nome'), listaEl=document.getElementById('lista');
let db; const dbReq=indexedDB.open('V86DB_VID',3);
dbReq.onupgradeneeded=e=>{const d=e.target.result; if(!d.objectStoreNames.contains('filmes')) d.createObjectStore('filmes',{keyPath:'id'});};
dbReq.onsuccess=e=>{db=e.target.result; carregarLocal();};
function carregarLocal(){
  const tx=db.transaction('filmes','readonly').objectStore('filmes').getAll();
  tx.onsuccess=()=>{ videos=tx.result || []; render(); if(videos.length) carregar(0); };
}
function render(){
  listaEl.innerHTML='';
  videos.forEach((m,i)=>{
    const d=document.createElement('div');
    d.className='item'+(i===idx?' ativo':'');
    d.innerText=(i+1)+'. '+m.nome;
    d.onclick=()=>carregar(i);
    listaEl.appendChild(d);
  });
}
function carregar(i){
  idx=i; const m=videos[idx]; if(!m) return;
  nomeEl.innerText='▶️ '+m.nome;
  player.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1&rel=0';
  render();
  window.scrollTo(0,0);
}
function pp(){ /* iframe nao tem pause pelo JS */ }
function prox(){ if(videos.length) carregar((idx+1)%videos.length); }
function ant(){ if(videos.length) carregar((idx-1+videos.length)%videos.length); }

function addLink(){
  const link=prompt('Cole link do YouTube:');
  if(!link) return;
  const m=link.match(/(?:youtu\.be\/|v=|embed\/)([a-zA-Z0-9_-]{11})/);
  if(!m) return alert('Link inválido!');
  const obj={id:Date.now(), nome:'Filme '+(videos.length+1), videoId:m[1]};
  const tx=db.transaction('filmes','readwrite'); tx.objectStore('filmes').add(obj);
  tx.objectStore('filmes').add(obj).onsuccess=()=>{}; // fix
  videos.push(obj); carregar(videos.length-1);
}

// --- BUSCA QUE FUNCIONA ---
async function buscar(){
  const q=document.getElementById('q').value.trim();
  if(!q) return alert('Digite o nome do filme!');
  nomeEl.innerText='🔍 Buscando '+q+'...';
  const apis=[
    'https://pipedapi.kavin.rocks/search?q=',
    'https://pipedapi.adminforge.de/search?q=',
    'https://api.piped.projectsegfau.lt/search?q='
  ];
  for(let base of apis){
    try{
      const r=await fetch(base+encodeURIComponent(q+' filme completo dublado'));
      const d=await r.json();
      const itens=(d.items||d).filter(x=>x.type==='stream' || x.url).slice(0,15);
      if(!itens.length) continue;
      const novos=itens.map(x=>{
        let vid=(x.url||'').split('v=')[1] || x.url.split('/').pop().substring(0,11);
        if(vid.includes('?')) vid=vid.split('?')[0];
        if(vid.length!=11) vid=x.id||vid;
        return {id:Date.now()+Math.random(), nome:x.title||x.name, videoId:vid};
      }).filter(x=>x.videoId && x.videoId.length==11);

      // Salva
      const tx=db.transaction('filmes','readwrite');
      const store=tx.objectStore('filmes');
      novos.forEach(n=>{try{store.add(n);}catch{}});
      videos=[...novos,...videos];
      render(); carregar(0);
      nomeEl.innerText='✅ '+novos.length+' filmes encontrados!';
      return;
    }catch(e){ console.log('falhou api', base, e); continue; }
  }
  nomeEl.innerText='❌ Erro na busca, tente: avengers';
}
</script>
</body></html>
