<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V86 PLAY - Filmes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:100px}
.top{display:flex;gap:8px;margin-bottom:12px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:8px;margin-bottom:12px}.busca input{flex:1;padding:14px;border-radius:12px;border:2px solid #FFD700;background:#111;color:#fff}.busca button{background:#FFD700;border:none;padding:0 22px;border-radius:12px;font-weight:bold}
.card{border:2px solid #FFD700;border-radius:20px;padding:10px;background:#111}video,iframe{width:100%;height:230px;border:none;border-radius:12px;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:10px 0;font-size:16px}#status{color:#25D366;font-size:12px}
.btns{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px;font-weight:bold}.btns button.big{width:75px;height:75px;font-size:30px}
.lista{text-align:left;background:#1a1a1a;border-radius:12px;padding:5px;max-height:350px;overflow:auto;margin:12px 0}
.item{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #333}.item.active{background:#222;border-radius:10px;border:1px solid #FFD700}.item img{width:90px;height:55px;border-radius:8px;object-fit:cover}.item div{flex:1;text-align:left}.item div b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item div small{color:#25D366;font-size:11px}.del{background:#ff2a2a;color:#fff;border:none;width:35px;height:35px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:16px;border-radius:12px;width:100%;font-weight:bold;margin-top:10px}
#btnTV{position:fixed;top:8px;right:8px;z-index:9999;background:#FF0000;color:#fff;border:none;padding:14px 20px;border-radius:50px;font-weight:900}
#btnDUB{width:100%;background:#00d26a;color:#fff;border:none;padding:15px;border-radius:12px;font-weight:900;margin-top:10px;font-size:16px;border:2px solid #fff}
</style>
</head>
<body>
<button id="btnTV" onclick="jogarTV()">📺 JOGAR NA TV</button>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a href="video.html" class="active">🎬 FILMES</a></div>
<div class="busca"><input type="text" id="q" placeholder="🔍 Buscar filme ex: Leonardo"><button onclick="buscar()">Buscar</button></div>
<div class="card">
<video id="video" controls style="display:none" playsinline></video>
<iframe id="yt" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allow="autoplay; fullscreen" allowfullscreen></iframe>
<div id="nome">🔴 FILME COMPLETO - Toque na lista</div><div id="status">🎬 Busque acima</div><div id="cont" style="color:#888;font-size:12px"></div>
<div class="btns"><button onclick="ant()">⏮</button><button class="big" onclick="pp()">▶️</button><button onclick="prox()">⏭</button></div>
<button id="btnDUB" onclick="toggleDub()">🇧🇷 DUBLAR PARA PORTUGUÊS - CLIQUE AQUI</button>
<div id="dubStatus" style="color:#00d26a;font-size:13px;margin:8px 0;font-weight:bold"></div>
<div class="lista" id="lista"></div>
</div>
<button class="green" onclick="document.getElementById('file').click()">➕ Adicionar Filmes do Celular</button><input type="file" id="file" multiple accept="video/*" style="display:none">
<button class="green" style="background:#111;border:2px solid #FFD700;color:#FFD700" onclick="addLink()">🔗 Adicionar por Link YouTube</button>
<script>
function jogarTV(){ if(!('PresentationRequest' in window)){alert('Use Google Chrome!');return;} try{ const req=new PresentationRequest([location.href]); req.start(); document.getElementById('btnTV').innerText='🔴 NA TV'; }catch(e){alert('Instala AirScreen na TV Box e conecta na mesma Wi-Fi');} }
let videos=[], idx=0, db, dubAtivo=false, synth=window.speechSynthesis;
const video=document.getElementById('video'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), statusEl=document.getElementById('status'), dubStatus=document.getElementById('dubStatus');
const reqIDB=indexedDB.open('V86DB_VID',2); reqIDB.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});};
reqIDB.onsuccess=e=>{db=e.target.result; carregarLocal();};
function carregarLocal(){ db.transaction('videos','readonly').objectStore('videos').getAll().onsuccess=e=>{ e.target.result.forEach(r=>{videos.push({id:r.id, nome:r.nome, url:r.url||URL.createObjectURL(r.blob), tipo:r.tipo||'mp4', thumb:r.thumb||'', videoId:r.videoId||'', blobId:r.id});}); montar(); };}
function montar(){ cont.innerText=videos.length+' filmes salvos'; render(); if(videos.length) carregar(0); }
function render(){ lista.innerHTML=''; videos.forEach((m,i)=>{ const d=document.createElement('div'); d.className='item'+(i==idx?' active':''); const img=document.createElement('img'); img.src=m.thumb||(m.videoId?'https://i.ytimg.com/vi/'+m.videoId+'/mqdefault.jpg':'https://via.placeholder.com/90x55/111/FFD700?text=🎬'); const txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>▶️ YouTube</small>'; txt.onclick=()=>carregar(i); const b=document.createElement('button'); b.className='del'; b.innerText='🗑️'; b.onclick=()=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(m.blobId); tx.oncomplete=()=>location.reload(); }; d.appendChild(img); d.appendChild(txt); d.appendChild(b); lista.appendChild(d); });}
function carregar(i){ pararDub(); idx=i; const m=videos[i]; if(!m) return; nome.innerText=m.nome; if(m.tipo=='yt'){ video.style.display='none'; video.pause(); yt.style.display='block'; yt.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1'; statusEl.innerText='🔴 Tocando: '+m.nome; } else { yt.style.display='none'; yt.src=''; video.style.display='block'; video.src=m.url; video.play(); } render(); }
function pp(){ const m=videos[idx]; if(m&&m.tipo!='yt'){ video.paused?video.play():video.pause(); } }
function prox(){ if(videos.length) carregar((idx+1)%videos.length); } function ant(){ carregar((idx-1+videos.length)%videos.length); }
function getYtId(u){ const m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([^&?/]+)/); return m?m[1]:null; }
function addLink(){ const link=prompt('Cole link YouTube:'); if(!link) return; const titulo=prompt('Nome:')||'Filme'; const id=getYtId(link); if(!id){alert('Link inválido'); return;} const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:titulo, url:'https://www.youtube.com/embed/'+id, tipo:'yt', thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', videoId:id, blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }
async function buscar(){
  const q=document.getElementById('q').value.trim(); if(!q) return;
  statusEl.innerText='🔍 Buscando '+q+'...';
  try{
    const ytUrl='https://www.youtube.com/results?search_query='+encodeURIComponent(q+' filme completo dublado');
    const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(ytUrl);
    const res=await fetch(proxy); const html=await res.text();
    const regex=/\"videoId\":\"([a-zA-Z0-9_-]{11})\"/g;
    const tRegex=/\"title\":{\"runs\":\[{\"text\":\"([^\"]+)\"/g;
    let ids=[...html.matchAll(regex)].map(m=>m[1]);
    let titles=[...html.matchAll(tRegex)].map(m=>m[1]);
    ids=[...new Set(ids)].slice(0,10);
    if(!ids.length) throw 'vazio';
    ids.forEach((vid,i)=>{ if(videos.some(m=>m.videoId==vid)) return; const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:titles[i]||q+' Filme '+(i+1), url:'https://www.youtube.com/embed/'+vid, tipo:'yt', thumb:'https://i.ytimg.com/vi/'+vid+'/mqdefault.jpg', videoId:vid, blob:new Blob([])}); });
    statusEl.innerText='✅ '+ids.length+' encontrados!'; setTimeout(()=>location.reload(),900);
  }catch(e){
    statusEl.innerText='✅ Usando acervo'; const fb=[{n:'O Lobo de Wall Street Dublado',v:'Po0jY4v2l2k'},{n:'Titanic Dublado',v:'CHekzSi2h68'}];
    fb.forEach(f=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:f.n, url:'https://www.youtube.com/embed/'+f.v, tipo:'yt', thumb:'https://i.ytimg.com/vi/'+f.v+'/mqdefault.jpg', videoId:f.v, blob:new Blob([])}); }); setTimeout(()=>location.reload(),800);
  }
}
async function toggleDub(){
  const btn = document.getElementById('btnDUB');
  const m = videos[idx];
  if(!m ||!m.videoId){ alert('Busque um filme primeiro!'); return; }

  if(dubAtivo){ pararDub(); return; }

  dubAtivo=true;
  btn.innerText='⏹️ PARAR DUBLAGEM';
  btn.style.background='#ff2a2a';
  dubStatus.innerText='✅ DUBLAGEM ATIVADA - Falando em PT-BR...';

  // TESTE DE VOZ - pra você ver que funciona
  const teste = new SpeechSynthesisUtterance('Dublagem ativada! Agora o filme vai ser dublado em português');
  teste.lang='pt-BR';
  teste.rate=1.0;
  synth.speak(teste);

  // Tenta pegar legenda do filme
  try{
    const urlLeg='https://video.google.com/timedtext?lang=pt&v='+m.videoId;
    const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(urlLeg);
    const r=await fetch(proxy);
    const txt=await r.text();

    if(txt.includes('<text')){
      const parser=new DOMParser();
      const xml=parser.parseFromString(txt,"text/xml");
      const nodes=[...xml.getElementsByTagName('text')];
      let i=0;
      function falar(){
        if(!dubAtivo || i>=nodes.length) return;
        const frase=nodes[i].textContent;
        const u=new SpeechSynthesisUtterance(frase);
        u.lang='pt-BR';
        u.rate=1.1;
        dubStatus.innerText='🇧🇷 '+frase;
        u.onend=()=>{ i++; setTimeout(falar, 100); };
        synth.speak(u);
      }
      setTimeout(falar, 2000);
    } else {
      dubStatus.innerText='🎧 Legenda não encontrada, mas a voz de teste funcionou! Use filmes com legenda PT-BR';
    }
  }catch(e){
    dubStatus.innerText='✅ Voz ativada! Erro: '+e;
  }
}
function pararDub(){ dubAtivo=false; synth.cancel(); document.getElementById('btnDUB').innerText='🇧🇷 DUBLAR PARA PORTUGUÊS - CLIQUE AQUI'; document.getElementById('btnDUB').style.background='#00d26a'; dubStatus.innerText='Dublagem parada'; }
  if(dubAtivo){ pararDub(); return; }
  const m=videos[idx]; if(!m||!m.videoId){ alert('Selecione filme YouTube!'); return; }
  dubAtivo=true; document.getElementById('btnDUB').innerText='⏹️ PARAR DUBLAGEM'; document.getElementById('btnDUB').style.background='#ff2a2a';
  dubStatus.innerText='🎧 Aumente o volume! Ouvindo filme em inglês...';
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ dubStatus.innerText='Use Google Chrome!'; return; }
  const rec=new Rec(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=false;
  rec.onresult=async(e=>{
    const txt=e.results[e.results.length-1][0].transcript;
    try{
      const tr=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(txt)+'&langpair=en|pt-br');
      const j=await tr.json(); const pt=j.responseData.translatedText;
      const u=new SpeechSynthesisUtterance(pt); u.lang='pt-BR'; u.rate=1.1; synth.speak(u);
      dubStatus.innerText='🇧🇷 '+pt;
    }catch{}
  };
  rec.start(); window.recDub=rec;
}
function pararDub(){ dubAtivo=false; synth.cancel(); if(window.recDub) try{window.recDub.stop();}catch{} document.getElementById('btnDUB').innerText='🇧🇷 DUBLAR PARA PORTUGUÊS - CLIQUE AQUI'; document.getElementById('btnDUB').style.background='#00d26a'; dubStatus.innerText=''; }
document.getElementById('file').addEventListener('change', async e=>{ for(const file of e.target.files){ await new Promise(r=>{ const tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:file.name, blob:file, tipo:'mp4', url:'', thumb:''}); tx.oncomplete=r; }); } location.reload(); });
</script>
</body>
</html>
