<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;text-align:center;padding:10px}
.top{display:flex;gap:6px;margin-bottom:10px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:6px;margin-bottom:10px}.busca input{flex:1;padding:14px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff}
.busca button{background:#FFD700;border:none;padding:0 18px;border-radius:10px;font-weight:bold}
.card{border:2px solid #FFD700;border-radius:15px;padding:10px;background:#111}
iframe,video{width:100%;height:220px;border:none;border-radius:10px;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0}#status{color:#25D366;font-size:12px}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0}.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px}.btns button.big{width:70px;height:70px;font-size:28px}
#btnDUB{background:#00d26a;color:#fff;border:2px solid #fff;padding:15px;width:100%;border-radius:12px;font-weight:900;font-size:15px;margin:10px 0}
#dubStatus{color:#00d26a;font-size:12px;min-height:18px}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto}
.item{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #333}
.item img{width:80px;height:50px;border-radius:6px;object-fit:cover}
.item div{flex:1;text-align:left}.item b{font-size:13px;display:block}.item small{color:#888;font-size:10px}
.del{background:#ff2a2a;color:#fff;border:none;width:30px;height:30px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a class="active">🎬 FILMES</a></div>
<div class="busca"><input id="q" placeholder="Ex: De volta para o futuro"><button onclick="buscar()">Buscar</button></div>
<div class="card">
<video id="video" controls style="display:none"></video>
<iframe id="yt" src="https://www.youtube.com/embed/9bZkp7q19f0?cc_load_policy=1" allowfullscreen></iframe>
<div id="nome">Toque na lista</div><div id="status"></div><div id="cont" style="font-size:11px;color:#888"></div>
<div class="btns"><button onclick="ant()">⏮</button><button class="big" onclick="pp()">▶️</button><button onclick="prox()">⏭</button></div>
<button id="btnDUB" onclick="dublagemReal()">🇧🇷 DUBLAR EM PORTUGUÊS</button>
<div id="dubStatus">Toque em DUBLAR para ouvir</div>
<div class="lista" id="lista"></div>
</div>
<button class="green" onclick="addLink()">🔗 Adicionar por Link YouTube</button>
<script>
let videos=[], idx=0, db, dubLigado=false, timer=null;
const video=document.getElementById('video'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), statusEl=document.getElementById('status'), dubStatus=document.getElementById('dubStatus');

let req=indexedDB.open('V86DB_VID',3);
req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true}); };
req.onsuccess=e=>{ db=e.target.result; init(); };

function init(){
 let t=db.transaction('videos','readonly').objectStore('videos').getAll();
 t.onsuccess=e=>{
  if(e.target.result.length==0){
   // FILMES PADRÃO QUE JÁ TÊM LEGENDA
   let padrao=[
    {nome:'De Volta para o Futuro - Dublado (Teste)', tipo:'yt', videoId:'qz8pK2fihRw', thumb:'https://i.ytimg.com/vi/qz8pK2fihRw/mqdefault.jpg'},
    {nome:'Filme Dublado Completo - Velozes', tipo:'yt', videoId:'9bZkp7q19f0', thumb:'https://i.ytimg.com/vi/9bZkp7q19f0/mqdefault.jpg'},
    {nome:'Rick Astley - Legenda PT-BR (Teste Dublagem)', tipo:'yt', videoId:'dQw4w9WgXcQ', thumb:'https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg'}
   ];
   padrao.forEach(f=>{
    let tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').add({nome:f.nome, tipo:f.tipo, videoId:f.videoId, thumb:f.thumb, blob:new Blob([])});
   });
   setTimeout(()=>location.reload(),800);
  } else {
   e.target.result.forEach(r=>{ videos.push({id:r.id, nome:r.nome, tipo:r.tipo, videoId:r.videoId, blobId:r.id, thumb:r.thumb}); });
   montar();
  }
 };
}
function montar(){ cont.innerText=videos.length+' filmes'; lista.innerHTML=''; videos.forEach((m,i)=>{ let d=document.createElement('div'); d.className='item'; let img=document.createElement('img'); img.src=m.thumb||'https://i.ytimg.com/vi/'+m.videoId+'/mqdefault.jpg'; let txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>'+m.videoId+'</small>'; txt.onclick=()=>tocar(i); let del=document.createElement('button'); del.className='del'; del.innerText='X'; del.onclick=()=>{ let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(m.blobId); tx.oncomplete=()=>location.reload(); }; d.appendChild(img); d.appendChild(txt); d.appendChild(del); lista.appendChild(d); }); if(videos.length) tocar(0); }
function tocar(i){ idx=i; let m=videos[i]; nome.innerText=m.nome; yt.style.display='block'; video.style.display='none'; video.pause(); yt.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1&cc_load_policy=1&cc_lang_pref=pt'; statusEl.innerText='Tocando: '+m.nome; parar(); }
function pp(){ if(video.style.display!='none'){ video.paused?video.play():video.pause(); } }
function prox(){ if(videos.length) tocar((idx+1)%videos.length); }
function ant(){ if(videos.length) tocar((idx-1+videos.length)%videos.length); }
function getId(u){ let m=u.match(/(?:v=|be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }
function addLink(){ let link=prompt('Cole link YouTube:'); if(!link) return; let id=getId(link); if(!id){ alert('Link inválido'); return; } let nomeF=prompt('Nome do filme:')||'Filme'; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:nomeF, tipo:'yt', videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }

// BUSCA NOVA QUE NÃO DÁ ERRO - USA INVIDIOUS
async function buscar(){
 let q=document.getElementById('q').value.trim(); if(!q){ alert('Digite o nome'); return; }
 statusEl.innerText='Buscando '+q+'...'; dubStatus.innerText='';
 try{
  // Usa API pública que não bloqueia
  let url='https://yewtu.be/api/v1/search?q='+encodeURIComponent(q+' filme dublado completo')+'&type=video';
  let r=await fetch(url); let data=await r.json();
  if(!data || data.length==0) throw 'vazio';
  let novos=0;
  data.slice(0,6).forEach(v=>{
   if(videos.some(x=>x.videoId==v.videoId)) return;
   let tx=db.transaction('videos','readwrite');
   tx.objectStore('videos').add({nome:v.title, tipo:'yt', videoId:v.videoId, thumb:'https://i.ytimg.com/vi/'+v.videoId+'/mqdefault.jpg', blob:new Blob([])});
   novos++;
  });
  statusEl.innerText=novos+' filmes encontrados!'; setTimeout(()=>location.reload(),1000);
 }catch(e){
  // Fallback: pede link
  statusEl.innerText='Busca bloqueada, use botão de link';
  alert('O YouTube bloqueou a busca automática. Clique em 🔗 Adicionar por Link YouTube e cole o link do filme. Isso funciona 100%.');
 }
}

async function dublagemReal(){
 let m=videos[idx]; if(!m){ alert('Escolha um filme na lista'); return; }
 if(dubLigado){ parar(); return; }
 dubLigado=true; document.getElementById('btnDUB').innerText='⏹️ PARAR DUBLAGEM'; document.getElementById('btnDUB').style.background='red';
 dubStatus.innerText='Baixando legenda real...';
 window.speechSynthesis.cancel();
 try{
  let listUrl='https://video.google.com/timedtext?type=list&v='+m.videoId;
  let proxyList='https://api.allorigins.win/raw?url='+encodeURIComponent(listUrl);
  let r1=await fetch(proxyList); let t1=await r1.text();
  let lang='pt'; if(t1.includes('pt-BR')) lang='pt-BR'; else if(t1.includes('lang_code="pt"')) lang='pt'; else if(t1.includes('lang_code="en"')) lang='en'; else lang='pt';
  let legUrl='https://video.google.com/timedtext?lang='+lang+'&v='+m.videoId;
  let proxyLeg='https://api.allorigins.win/raw?url='+encodeURIComponent(legUrl);
  let r2=await fetch(proxyLeg); let t2=await r2.text();
  if(!t2.includes('<text')){ dubStatus.innerText='Esse filme não tem legenda. Tente outro da lista (Rick Astley tem)'; parar(); return; }
  let doc=new DOMParser().parseFromString(t2,'text/xml');
  let nodes=[...doc.getElementsByTagName('text')];
  let legs=nodes.map(n=>({s:parseFloat(n.getAttribute('start')), t:n.textContent.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&')}));
  dubStatus.innerText='Dublando '+legs.length+' falas em PT-BR... Abaixe o volume original';
  if(lang=='en'){
   dubStatus.innerText='Traduzindo para PT-BR...';
   for(let i=0;i<Math.min(legs.length,20);i++){
    try{ let tr=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(legs[i].t)+'&langpair=en|pt-br'); let j=await tr.json(); legs[i].t=j.responseData.translatedText; }catch{}
   }
  }
  let start=Date.now()/1000; let p=0;
  timer=setInterval(()=>{
   if(!dubLigado) return; let now=Date.now()/1000 - start;
   while(p<legs.length && legs[p].s <= now){
    let u=new SpeechSynthesisUtterance(legs[p].t); u.lang='pt-BR'; u.rate=1.1; window.speechSynthesis.speak(u); dubStatus.innerText='🇧🇷 '+legs[p].t; p++; }
   if(p>=legs.length){ clearInterval(timer); dubStatus.innerText='Fim da dublagem'; }
  },200);
 }catch(e){ dubStatus.innerText='Erro: '+e; parar(); }
}
function parar(){ dubLigado=false; clearInterval(timer); window.speechSynthesis.cancel(); let b=document.getElementById('btnDUB'); b.innerText='🇧🇷 DUBLAR EM PORTUGUÊS'; b.style.background='#00d26a'; }
</script>
</body>
</html>
