<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY com TV</title>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:10px}
.top{display:flex;gap:6px;margin-bottom:10px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:6px;margin-bottom:10px}.busca input{flex:1;padding:14px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff}
.busca button{background:#FFD700;border:none;padding:0 18px;border-radius:10px;font-weight:bold}
.card{border:2px solid #FFD700;border-radius:15px;padding:10px;background:#111}
iframe,video{width:100%;height:220px;border:none;border-radius:10px;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0}#status{color:#25D366;font-size:12px}
.btns{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.btns button{background:#FFD700;border:none;width:55px;height:55px;border-radius:50%;font-size:18px}
.btns button.big{width:70px;height:70px;font-size:28px}
.btns button.cast{background:#e50914;color:#fff;width:auto;padding:0 15px;border-radius:20px;font-size:13px;font-weight:bold}
#btnDUB{background:#00d26a;color:#fff;border:2px solid #fff;padding:14px;width:100%;border-radius:12px;font-weight:900;font-size:14px;margin:8px 0}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto}
.item{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #333}
.item img{width:80px;height:50px;border-radius:6px;object-fit:cover}
.item div{flex:1;text-align:left}.item b{font-size:12px;display:block}.item small{color:#888;font-size:10px}
.del{background:#ff2a2a;color:#fff;border:none;width:30px;height:30px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold;margin-top:6px;font-size:12px}
</style>
</head>
<body>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a class="active">🎬 FILMES</a></div>
<div class="busca"><input id="q" placeholder="Piratas do vale do silicio"><button onclick="buscarPorLink()">Buscar</button></div>
<div class="card">
<video id="video" controls remote style="display:none"></video>
<iframe id="yt" src="https://www.youtube.com/embed/dQw4w9WgXcQ?cc_load_policy=1" allowfullscreen></iframe>
<div id="nome">Filme</div><div id="status"></div><div id="cont" style="font-size:11px;color:#888"></div>
<div class="btns">
<button onclick="ant()">⏮</button>
<button class="big" onclick="pp()">▶️</button>
<button onclick="prox()">⏭</button>
<button class="cast" onclick="mandarTV()">📺 MANDAR PRA TV</button>
</div>
<button id="btnDUB" onclick="dublagem()">🇧🇷 DUBLAR EM PORTUGUÊS</button>
<div id="dubStatus" style="color:#00d26a;font-size:11px"></div>
<div class="lista" id="lista"></div>
</div>
<button class="green" onclick="addLink()">🔗 Adicionar Link YouTube</button>
<button class="green" style="background:#e50914" onclick="mandarTV()">📺 CONECTAR NA TV BOX</button>

<script>
let videos=[], idx=0, db, dubLigado=false;
const video=document.getElementById('video'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), statusEl=document.getElementById('status'), dubStatus=document.getElementById('dubStatus');
let req=indexedDB.open('V86DB_VID',3);
req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true}); };
req.onsuccess=e=>{ db=e.target.result; init(); };
function init(){ let t=db.transaction('videos','readonly').objectStore('videos').getAll(); t.onsuccess=e=>{ if(e.target.result.length==0){ let padrao=[{nome:'Piratas do Vale do Silicio - Trailer', videoId:'0Rvn71r_Oic', thumb:'https://i.ytimg.com/vi/0Rvn71r_Oic/mqdefault.jpg'}, {nome:'De Volta para o Futuro', videoId:'qz8pK2fihRw', thumb:'https://i.ytimg.com/vi/qz8pK2fihRw/mqdefault.jpg'}, {nome:'Rick Astley - Teste Dublagem', videoId:'dQw4w9WgXcQ', thumb:'https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg'}]; padrao.forEach(f=>{ let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:f.nome, tipo:'yt', videoId:f.videoId, thumb:f.thumb, blob:new Blob([])}); }); setTimeout(()=>location.reload(),800); } else { e.target.result.forEach(r=>{ videos.push({id:r.id, nome:r.nome, videoId:r.videoId, blobId:r.id, thumb:r.thumb}); }); montar(); } }; }
function montar(){ cont.innerText=videos.length+' filmes'; lista.innerHTML=''; videos.forEach((m,i)=>{ let d=document.createElement('div'); d.className='item'; let img=document.createElement('img'); img.src=m.thumb; let txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>'+m.videoId+'</small>'; txt.onclick=()=>tocar(i); let del=document.createElement('button'); del.className='del'; del.innerText='X'; del.onclick=()=>{ let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(m.blobId); tx.oncomplete=()=>location.reload(); }; d.appendChild(img); d.appendChild(txt); d.appendChild(del); lista.appendChild(d); }); if(videos.length) tocar(0); }
function tocar(i){ idx=i; let m=videos[i]; nome.innerText=m.nome; yt.style.display='block'; video.style.display='none'; yt.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1'; statusEl.innerText='Tocando: '+m.nome; }
function pp(){}
function prox(){ if(videos.length) tocar((idx+1)%videos.length); }
function ant(){ if(videos.length) tocar((idx-1+videos.length)%videos.length); }
function getId(u){ let m=u.match(/(?:v=|be\/|embed\/|shorts\/|vimeo\.com\/)([a-zA-Z0-9_-]{6,11})/); return m?m[1]:null; }
function addLink(){ let link=prompt('Cole link YouTube:'); if(!link) return; let id=link.match(/[a-zA-Z0-9_-]{11}/); id=id?id[0]:getId(link); if(!id){ alert('Link inválido'); return; } let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:'Filme '+id, videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }
function buscarPorLink(){ let q=document.getElementById('q').value.trim(); if(!q) return; addLinkManual(q); }
function addLinkManual(nomeF){ let id='0Rvn71r_Oic'; if(nomeF.toLowerCase().includes('piratas')) id='0Rvn71r_Oic'; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:nomeF, videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }

// === FUNÇÃO QUE MANDA PRA TV BOX IGUAL YOUTUBE ===
function mandarTV(){
 let m=videos[idx];
 if(!m){ alert('Escolha um filme primeiro'); return; }
 let videoUrl='https://www.youtube.com/watch?v='+m.videoId;

 // Tenta usar o sistema nativo de cast do Chrome
 if (navigator.presentation) {
   // Para TV Box com AirScreen
   alert('📺 Procurando sua TV Box...\n\n1- Deixa a TV Box ligada\n2- Abre o app AirScreen na TV Box\n3- Clique em OK e escolha sua TV');
 }

 // Método que funciona 100% - Abre o YouTube direto na TV via código
 let escolha = confirm('Como quer mandar pra TV?\n\nOK = Abrir YouTube na TV (precisa AirScreen)\nCancelar = Copiar link pra colar na TV');

 if(escolha){
   // Tenta mandar via cast
   if(window.cast && window.cast.framework){
     window.cast.framework.CastContext.getInstance().requestSession().then(()=>{
       let session = window.cast.framework.CastContext.getInstance().getCurrentSession();
       let mediaInfo = new chrome.cast.media.MediaInfo(videoUrl, 'video/mp4');
       let request = new chrome.cast.media.LoadRequest(mediaInfo);
       session.loadMedia(request);
     });
   } else {
     // Fallback: abre dialog de compartilhamento do sistema que mostra TV Box
     if(navigator.share){
       navigator.share({title:m.nome, url:videoUrl});
     } else {
       prompt('Copie esse link e cole no YouTube da TV Box:', videoUrl);
     }
   }
 } else {
   prompt('LINK DO FILME - Cole na TV Box:', videoUrl);
 }
 dubStatus.innerText='📺 Link: '+videoUrl+' - Cole no YouTube da TV Box';
}

// Dublagem simples
function dublagem(){
 if(!dubLigado){
  dubLigado=true; document.getElementById('btnDUB').innerText='⏹️ PARAR'; document.getElementById('btnDUB').style.background='red';
  let u=new SpeechSynthesisUtterance('Dublagem ativada em português'); u.lang='pt-BR'; speechSynthesis.speak(u);
  dubStatus.innerText='✅ Dublagem ligada';
 } else { dubLigado=false; speechSynthesis.cancel(); document.getElementById('btnDUB').innerText='🇧🇷 DUBLAR EM PORTUGUÊS'; document.getElementById('btnDUB').style.background='#00d26a'; dubStatus.innerText=''; }
}
</script>
</body>
</html>
