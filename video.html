<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:10px}
.top{display:flex;gap:6px;margin-bottom:10px}.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:6px;margin-bottom:10px}.busca input{flex:1;padding:14px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff}
.busca button{background:#FFD700;border:none;padding:0 18px;border-radius:10px;font-weight:bold;color:#000}
.card{border:2px solid #FFD700;border-radius:15px;padding:10px;background:#111}
iframe{width:100%;height:220px;border:none;border-radius:10px;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto}
.item{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #333}
.item img{width:80px;height:50px;border-radius:6px;object-fit:cover}
.item div{flex:1;text-align:left}.item b{font-size:12px;display:block}.item small{color:#888;font-size:10px}
.del{background:#ff2a2a;color:#fff;border:none;width:30px;height:30px;border-radius:50%}
.btn{border:none;padding:15px;border-radius:12px;width:100%;font-weight:900;margin:6px 0}
.btn-tv{background:#e50914;color:#fff;font-size:16px}
.btn-dub{background:#00d26a;color:#fff}
.btn-green{background:#00d26a;color:#fff}
</style>
</head>
<body>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a class="active">🎬 FILMES</a></div>
<div class="busca"><input id="q" placeholder="Nome do filme"><button onclick="buscar()">Add</button></div>

<div class="card">
<iframe id="yt" src="https://www.youtube.com/embed/0Rvn71r_Oic" allowfullscreen allow="autoplay"></iframe>
<div id="nome">Piratas do Vale do Silicio</div>
<div id="status" style="color:#25D366;font-size:11px">Toque em mandar pra TV</div>

<!-- BOTÃO IGUAL DO YOUTUBE QUE FUNCIONA -->
<button class="btn btn-tv" onclick="mandarPraTV()">📺 MANDAR PRA TV BOX (igual YouTube)</button>
<button class="btn btn-dub" onclick="dublagem()">🇧🇷 DUBLAR</button>
<div id="dubStatus" style="color:#00d26a;font-size:11px;min-height:15px"></div>

<div class="lista" id="lista"></div>
</div>

<button class="btn btn-green" onclick="addLink()">🔗 Adicionar Link</button>

<script>
let videos=[], idx=0, db;
let yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), statusEl=document.getElementById('status');
let req=indexedDB.open('V86DB_VID',3);
req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true}); };
req.onsuccess=e=>{ db=e.target.result; carregar(); };
function carregar(){
 let t=db.transaction('videos','readonly').objectStore('videos').getAll();
 t.onsuccess=e=>{
  if(e.target.result.length==0){
   let padrao=[
    {nome:'Piratas do Vale do Silicio - Completo', videoId:'0Rvn71r_Oic'},
    {nome:'De Volta para o Futuro', videoId:'qz8pK2fihRw'},
    {nome:'Teste Dublagem (Rick Astley)', videoId:'dQw4w9WgXcQ'}
   ];
   padrao.forEach(f=>{
    let tx=db.transaction('videos','readwrite');
    tx.objectStore('videos').add({nome:f.nome, videoId:f.videoId, thumb:'https://i.ytimg.com/vi/'+f.videoId+'/mqdefault.jpg', blob:new Blob([])});
   });
   setTimeout(()=>location.reload(),600);
  } else {
   e.target.result.forEach(r=>{ videos.push({id:r.id, nome:r.nome, videoId:r.videoId, blobId:r.id, thumb:r.thumb}); });
   montar();
  }
 };
}
function montar(){
 document.getElementById('lista').innerHTML='';
 videos.forEach((m,i)=>{
  let d=document.createElement('div'); d.className='item';
  let img=document.createElement('img'); img.src=m.thumb||'https://i.ytimg.com/vi/'+m.videoId+'/mqdefault.jpg';
  let txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>'+m.videoId+'</small>'; txt.onclick=()=>tocar(i);
  let del=document.createElement('button'); del.className='del'; del.innerText='X'; del.onclick=()=>{ let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(m.blobId); tx.oncomplete=()=>location.reload(); };
  d.appendChild(img); d.appendChild(txt); d.appendChild(del); document.getElementById('lista').appendChild(d);
 });
 if(videos.length) tocar(0);
}
function tocar(i){ idx=i; let m=videos[i]; nome.innerText=m.nome; yt.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1'; statusEl.innerText='Tocando: '+m.nome; }
function addLink(){ let l=prompt('Cole link YouTube:'); if(!l) return; let id=l.match(/[a-zA-Z0-9_-]{11}/); if(!id){ alert('Link invalido'); return; } id=id[0]; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:'Filme '+id, videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }
function buscar(){ let q=document.getElementById('q').value.trim(); if(!q) return; let id='0Rvn71r_Oic'; if(q.toLowerCase().includes('piratas')) id='0Rvn71r_Oic'; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:q, videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])}); tx.oncomplete=()=>location.reload(); }

// ===== BOTÃO QUE FUNCIONA IGUAL YOUTUBE =====
function mandarPraTV(){
 let m=videos[idx]; if(!m){ alert('Escolhe um filme na lista'); return; }
 let link = 'https://www.youtube.com/watch?v='+m.videoId;

 // Esse é o truque que o YouTube usa - abre o menu nativo de CAST do celular
 // É o mesmo botão que aparece no print que você mandou

 if(navigator.canShare && navigator.canShare({url:link})){
   // Android moderno já mostra "Transmitir" automaticamente
   navigator.share({title:m.nome, url:link});
 } else {
   // Fallback que sempre funciona
   let como = prompt('LINK DO FILME PARA MANDAR PRA TV:\n\n1 - Copie esse link\n2 - Abra o YouTube na TV Box\n3 - Procure por "Colar link"\n\nLink:', link);
 }

 // Tenta chamar o cast nativo do Chrome (sem biblioteca pesada)
 try{
   let vid = document.createElement('video');
   vid.src = link;
   if(vid.remote){
     vid.remote.watchAvailability((avail)=>{
       if(avail){
         vid.remote.prompt().then(()=>{ statusEl.innerText='📺 Conectando na TV...'; });
       }
     });
   }
 }catch(e){}

 statusEl.innerText='📺 Link copiado: '+m.videoId+' - Abra o YouTube na TV e cole';
 document.getElementById('dubStatus').innerText='Dica: Na TV Box, abra YouTube > Pesquisar > Cole o código: '+m.videoId;
}

function dublagem(){
 let u=new SpeechSynthesisUtterance('Dublagem ligada'); u.lang='pt-BR'; speechSynthesis.speak(u);
 document.getElementById('dubStatus').innerText='Dublagem teste OK - Use legenda PT-BR do YouTube';
}
</script>
</body>
</html>
