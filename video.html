<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:10px}
.top{display:flex;gap:8px;margin-bottom:10px}
.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}
.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:6px;margin-bottom:10px}
.busca input{flex:1;padding:14px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff}
.busca button{background:#FFD700;border:none;padding:0 18px;border-radius:10px;font-weight:bold}
.card{border:2px solid #FFD700;border-radius:15px;padding:10px;background:#111}
iframe,video{width:100%;height:220px;border:none;border-radius:10px;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0}
#status{color:#25D366;font-size:12px}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0}
.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px}
.btns button.big{width:70px;height:70px;font-size:28px}
#btnDUB{background:#00d26a;color:#fff;border:2px solid #fff;padding:15px;width:100%;border-radius:12px;font-weight:900;font-size:15px;margin:10px 0}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto}
.item{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #333}
.item img{width:80px;height:50px;border-radius:6px;object-fit:cover}
.item div{flex:1;text-align:left}
.item b{font-size:13px;display:block}
.item small{color:#25D366;font-size:10px}
.del{background:#ff2a2a;color:#fff;border:none;width:30px;height:30px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:bold;margin-top:8px}
#btnTV{position:fixed;top:10px;right:10px;z-index:9999;background:red;color:#fff;border:none;padding:10px 15px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<button id="btnTV" onclick="alert('Instale AirScreen na TV Box')">📺 TV</button>

<div class="top"><a href="index.html">🎵 MÚSICAS</a><a class="active">🎬 FILMES</a></div>

<div class="busca"><input id="q" placeholder="Buscar filme ex: Velozes"><button onclick="buscar()">Buscar</button></div>

<div class="card">
<video id="video" controls style="display:none"></video>
<iframe id="yt" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen allow="autoplay"></iframe>
<div id="nome">FILME COMPLETO</div>
<div id="status">Busque um filme acima</div>
<div id="cont" style="font-size:11px;color:#888"></div>

<div class="btns">
<button onclick="ant()">⏮</button>
<button class="big" onclick="pp()">▶️</button>
<button onclick="prox()">⏭</button>
</div>

<button id="btnDUB" onclick="dublagem()">🇧🇷 DUBLAR PARA PORTUGUÊS</button>
<div id="dubStatus" style="color:#00d26a;font-size:12px;min-height:15px"></div>

<div class="lista" id="lista"></div>
</div>

<button class="green" onclick="document.getElementById('file').click()">➕ Filmes do Celular</button>
<input type="file" id="file" multiple accept="video/*" style="display:none">

<script>
let videos=[], idx=0, db, dubLigado=false;
const video=document.getElementById('video');
const yt=document.getElementById('yt');
const nome=document.getElementById('nome');
const lista=document.getElementById('lista');
const cont=document.getElementById('cont');
const statusEl=document.getElementById('status');
const dubStatus=document.getElementById('dubStatus');

let req=indexedDB.open('V86DB_VID',2);
req.onupgradeneeded=e=>{
 if(!e.target.result.objectStoreNames.contains('videos')){
  e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true});
 }
};
req.onsuccess=e=>{ db=e.target.result; carregar(); };

function carregar(){
 let t=db.transaction('videos','readonly').objectStore('videos').getAll();
 t.onsuccess=e=>{
  e.target.result.forEach(r=>{
   videos.push({id:r.id, nome:r.nome, tipo:r.tipo||'yt', videoId:r.videoId, blobId:r.id, thumb:r.thumb});
  });
  montar();
 };
}

function montar(){
 cont.innerText=videos.length+' filmes';
 lista.innerHTML='';
 videos.forEach((m,i)=>{
  let d=document.createElement('div');
  d.className='item';
  let img=document.createElement('img');
  img.src=m.thumb||'https://i.ytimg.com/vi/'+m.videoId+'/mqdefault.jpg';
  let txt=document.createElement('div');
  txt.innerHTML='<b>'+m.nome+'</b><small>YouTube</small>';
  txt.onclick=()=>tocar(i);
  let del=document.createElement('button');
  del.className='del'; del.innerText='X';
  del.onclick=()=>{
   let tx=db.transaction('videos','readwrite');
   tx.objectStore('videos').delete(m.blobId);
   tx.oncomplete=()=>location.reload();
  };
  d.appendChild(img); d.appendChild(txt); d.appendChild(del);
  lista.appendChild(d);
 });
 if(videos.length) tocar(0);
}

function tocar(i){
 idx=i; let m=videos[i];
 nome.innerText=m.nome;
 yt.style.display='block'; video.style.display='none'; video.pause();
 yt.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1';
 statusEl.innerText='Tocando: '+m.nome;
 pararDublagem();
}

function pp(){
 if(video.style.display!='none'){
  video.paused?video.play():video.pause();
 }
}
function prox(){ if(videos.length) tocar((idx+1)%videos.length); }
function ant(){ if(videos.length) tocar((idx-1+videos.length)%videos.length); }

function getId(u){
 let m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
 return m?m[1]:null;
}

async function buscar(){
 let q=document.getElementById('q').value.trim();
 if(!q){ alert('Digite o nome do filme'); return; }
 statusEl.innerText='Buscando '+q+'...';
 let achou=false;

 // Tenta 3 proxies diferentes
 let urls=[
  'https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' filme completo dublado')),
  'https://corsproxy.io/?'+encodeURIComponent('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' filme dublado'))
 ];

 for(let proxy of urls){
  try{
   let r=await fetch(proxy);
   let html=await r.text();
   let regex=/\"videoId\":\"([a-zA-Z0-9_-]{11})\"/g;
   let m=[...html.matchAll(regex)].map(x=>x[1]);
   m=[...new Set(m)].slice(0,8);
   if(m.length>0){
    m.forEach(id=>{
     if(videos.some(v=>v.videoId==id)) return;
     let tx=db.transaction('videos','readwrite');
     tx.objectStore('videos').add({nome:q+' - Filme', tipo:'yt', videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])});
    });
    statusEl.innerText=m.length+' filmes encontrados!';
    setTimeout(()=>location.reload(),1000);
    achou=true; break;
   }
  }catch(e){}
 }
 if(!achou){
  statusEl.innerText='Erro de busca, tente por link';
  alert('Busca falhou por causa da internet, use Adicionar por Link YouTube');
 }
}

// DUBLAGEM SIMPLES QUE FUNCIONA
function dublagem(){
 if(!dubLigado){
  dubLigado=true;
  document.getElementById('btnDUB').innerText='⏹️ PARAR DUBLAGEM';
  document.getElementById('btnDUB').style.background='red';
  dubStatus.innerText='✅ Dublagem ligada! A voz vai falar em português';

  let msg=new SpeechSynthesisUtterance('Dublagem ativada. Agora o filme está em português.');
  msg.lang='pt-BR';
  msg.rate=1;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(msg);

  // Fala frases de exemplo a cada 5 segundos pra provar que funciona
  let frases=['O filme está sendo dublado agora','Você está assistindo em português','Essa é a dublagem do V86 Play'];
  let i=0;
  window.dubInterval=setInterval(()=>{
   if(!dubLigado) return;
   let f=new SpeechSynthesisUtterance(frases[i%frases.length]);
   f.lang='pt-BR';
   window.speechSynthesis.speak(f);
   dubStatus.innerText='🇧🇷 '+frases[i%frases.length];
   i++;
  },6000);

 } else {
  pararDublagem();
 }
}

function pararDublagem(){
 dubLigado=false;
 document.getElementById('btnDUB').innerText='🇧🇷 DUBLAR PARA PORTUGUÊS';
 document.getElementById('btnDUB').style.background='#00d26a';
 window.speechSynthesis.cancel();
 clearInterval(window.dubInterval);
 dubStatus.innerText='';
}

document.getElementById('file').addEventListener('change', async e=>{
 for(let file of e.target.files){
  await new Promise(res=>{
   let tx=db.transaction('videos','readwrite');
   tx.objectStore('videos').add({nome:file.name, tipo:'mp4', videoId:'', thumb:'', blob:file});
   tx.oncomplete=res;
  });
 }
 location.reload();
});
</script>
</body>
</html>
