<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY - Dublagem Real</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;text-align:center;padding:10px;padding-bottom:80px}
.top{display:flex;gap:6px;margin-bottom:10px}
.top a{flex:1;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold;background:#222;color:#FFD700;border:2px solid #FFD700}
.top a.active{background:#FFD700;color:#000}
.busca{display:flex;gap:6px;margin-bottom:10px}
.busca input{flex:1;padding:14px;border-radius:10px;border:2px solid #FFD700;background:#111;color:#fff}
.busca button{background:#FFD700;border:none;padding:0 18px;border-radius:10px;font-weight:bold;color:#000}
.card{border:2px solid #FFD700;border-radius:15px;padding:10px;background:#111}
iframe,video{width:100%;height:220px;border:none;border-radius:10px;background:#000}
#nome{color:#FFD700;font-weight:bold;margin:8px 0}
#status{color:#25D366;font-size:12px}
.btns{display:flex;justify-content:center;gap:10px;margin:10px 0}
.btns button{background:#FFD700;border:none;width:60px;height:60px;border-radius:50%;font-size:20px}
.btns button.big{width:70px;height:70px;font-size:28px}
#btnDUB{background:#00d26a;color:#fff;border:2px solid #fff;padding:15px;width:100%;border-radius:12px;font-weight:900;font-size:15px;margin:10px 0}
#btnDUB.parar{background:red}
.lista{text-align:left;background:#1a1a1a;border-radius:10px;padding:5px;max-height:300px;overflow:auto}
.item{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #333}
.item img{width:80px;height:50px;border-radius:6px;object-fit:cover}
.item div{flex:1;text-align:left}.item b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:#25D366;font-size:10px}
.del{background:#ff2a2a;color:#fff;border:none;width:30px;height:30px;border-radius:50%}
.green{background:#00d26a;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:bold;margin-top:8px}
#btnTV{position:fixed;top:10px;right:10px;z-index:9999;background:red;color:#fff;border:none;padding:10px 15px;border-radius:20px;font-weight:bold}
#dubStatus{color:#00d26a;font-size:12px;min-height:20px;margin:5px 0}
</style>
</head>
<body>
<button id="btnTV" onclick="alert('Instala AirScreen na TV')">📺 TV</button>
<div class="top"><a href="index.html">🎵 MÚSICAS</a><a class="active">🎬 FILMES</a></div>
<div class="busca"><input id="q" placeholder="Buscar ex: De volta para o futuro dublado"><button onclick="buscar()">Buscar</button></div>
<div class="card">
<video id="video" controls style="display:none"></video>
<iframe id="yt" src="https://www.youtube.com/embed/dQw4w9WgXcQ?cc_load_policy=1&cc_lang_pref=pt" allowfullscreen allow="autoplay"></iframe>
<div id="nome">FILME COMPLETO</div><div id="status">Busque um filme acima</div>
<div id="cont" style="font-size:11px;color:#888"></div>
<div class="btns"><button onclick="ant()">⏮</button><button class="big" onclick="pp()">▶️</button><button onclick="prox()">⏭</button></div>
<button id="btnDUB" onclick="dublagemReal()">🇧🇷 DUBLAR LEGENDA EM PORTUGUÊS</button>
<div id="dubStatus"></div>
<div class="lista" id="lista"></div>
</div>
<button class="green" onclick="document.getElementById('file').click()">➕ Filmes do Celular</button>
<input type="file" id="file" multiple accept="video/*" style="display:none">
<script>
let videos=[], idx=0, db, dubLigado=false, legendas=[], timerDub=null;
const video=document.getElementById('video'), yt=document.getElementById('yt'), nome=document.getElementById('nome'), lista=document.getElementById('lista'), cont=document.getElementById('cont'), statusEl=document.getElementById('status'), dubStatus=document.getElementById('dubStatus');
let req=indexedDB.open('V86DB_VID',2);
req.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('videos')) e.target.result.createObjectStore('videos',{keyPath:'id',autoIncrement:true}); };
req.onsuccess=e=>{ db=e.target.result; carregar(); };
function carregar(){ let t=db.transaction('videos','readonly').objectStore('videos').getAll(); t.onsuccess=e=>{ e.target.result.forEach(r=>{ videos.push({id:r.id, nome:r.nome, tipo:r.tipo||'yt', videoId:r.videoId, blobId:r.id, thumb:r.thumb}); }); montar(); }; }
function montar(){ cont.innerText=videos.length+' filmes'; lista.innerHTML=''; videos.forEach((m,i)=>{ let d=document.createElement('div'); d.className='item'; let img=document.createElement('img'); img.src=m.thumb||'https://i.ytimg.com/vi/'+m.videoId+'/mqdefault.jpg'; let txt=document.createElement('div'); txt.innerHTML='<b>'+m.nome+'</b><small>YouTube</small>'; txt.onclick=()=>tocar(i); let del=document.createElement('button'); del.className='del'; del.innerText='X'; del.onclick=()=>{ let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(m.blobId); tx.oncomplete=()=>location.reload(); }; d.appendChild(img); d.appendChild(txt); d.appendChild(del); lista.appendChild(d); }); if(videos.length) tocar(0); }
function tocar(i){ idx=i; let m=videos[i]; nome.innerText=m.nome; yt.style.display='block'; video.style.display='none'; video.pause(); yt.src='https://www.youtube.com/embed/'+m.videoId+'?autoplay=1&cc_load_policy=1&cc_lang_pref=pt'; statusEl.innerText='Tocando: '+m.nome; pararDublagem(); }
function pp(){ if(video.style.display!='none'){ video.paused?video.play():video.pause(); } }
function prox(){ if(videos.length) tocar((idx+1)%videos.length); }
function ant(){ if(videos.length) tocar((idx-1+videos.length)%videos.length); }

async function buscar(){
 let q=document.getElementById('q').value.trim(); if(!q){ alert('Digite o nome'); return; }
 statusEl.innerText='Buscando...';
 try{
  let proxy='https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' filme completo dublado'));
  let r=await fetch(proxy); let html=await r.text();
  let regex=/\"videoId\":\"([a-zA-Z0-9_-]{11})\"/g;
  let ids=[...html.matchAll(regex)].map(x=>x[1]);
  ids=[...new Set(ids)].slice(0,8);
  if(ids.length==0) throw 'nada';
  ids.forEach(id=>{ if(videos.some(v=>v.videoId==id)) return; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:q, tipo:'yt', videoId:id, thumb:'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg', blob:new Blob([])}); });
  statusEl.innerText=ids.length+' filmes encontrados!'; setTimeout(()=>location.reload(),900);
 }catch(e){ statusEl.innerText='Erro, tente link'; alert('Erro na busca, tente de novo'); }
}

// === DUBLAGEM REAL DA LEGENDA ===
async function dublagemReal(){
 let m=videos[idx]; if(!m||!m.videoId){ alert('Busque um filme primeiro'); return; }
 if(dubLigado){ pararDublagem(); return; }
 dubLigado=true;
 let btn=document.getElementById('btnDUB'); btn.innerText='⏹️ PARAR DUBLAGEM'; btn.classList.add('parar');
 dubStatus.innerText='🔍 Baixando legenda do filme...';
 window.speechSynthesis.cancel();
 try{
  // 1. tenta pegar lista de legendas
  let listUrl='https://video.google.com/timedtext?type=list&v='+m.videoId;
  let proxyList='https://api.allorigins.win/raw?url='+encodeURIComponent(listUrl);
  let rList=await fetch(proxyList); let xmlList=await rList.text();
  // procura pt
  let lang='pt';
  if(xmlList.includes('lang_code="pt-BR"')) lang='pt-BR';
  else if(xmlList.includes('lang_code="pt"')) lang='pt';
  else if(xmlList.includes('lang_code="en"')) lang='en';

  dubStatus.innerText='📥 Baixando legenda '+lang+'...';
  let legUrl='https://video.google.com/timedtext?lang='+lang+'&v='+m.videoId;
  let proxyLeg='https://api.allorigins.win/raw?url='+encodeURIComponent(legUrl);
  let rLeg=await fetch(proxyLeg); let xmlLeg=await rLeg.text();
  if(!xmlLeg.includes('<text')){ dubStatus.innerText='❌ Esse filme não tem legenda. Busque outro com legenda PT-BR'; pararDublagem(); return; }

  let parser=new DOMParser(); let doc=parser.parseFromString(xmlLeg,'text/xml');
  let nodes=[...doc.getElementsByTagName('text')];
  legendas=nodes.map(n=>{ return {start:parseFloat(n.getAttribute('start')), text:n.textContent.replace(/&#39;/g,"'").replace(/&quot;/g,'"')} });

  dubStatus.innerText='✅ '+legendas.length+' falas encontradas. Dublando em PT-BR... Mute o vídeo original!';

  // Se legenda for em inglês, traduz
  if(lang=='en'){
   dubStatus.innerText='🌎 Traduzindo '+legendas.length+' falas para PT-BR... (pode demorar 10s)';
   for(let i=0;i<Math.min(legendas.length,30);i++){
    try{
     let tr=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(legendas[i].text)+'&langpair=en|pt-br');
     let j=await tr.json(); legendas[i].text=j.responseData.translatedText;
    }catch{}
   }
  }

  // Começa a falar seguindo o tempo
  let inicio=Date.now()/1000;
  let pos=0;
  timerDub=setInterval(()=>{
   if(!dubLigado){ clearInterval(timerDub); return; }
   let tempo= (Date.now()/1000 - inicio);
   while(pos<legendas.length && legendas[pos].start <= tempo){
    let fala=legendas[pos].text;
    let u=new SpeechSynthesisUtterance(fala);
    u.lang='pt-BR'; u.rate=1.1;
    window.speechSynthesis.speak(u);
    dubStatus.innerText='🇧🇷 '+fala.substring(0,60);
    pos++;
   }
   if(pos>=legendas.length){ dubStatus.innerText='✅ Filme dublado até o fim'; clearInterval(timerDub); }
  },300);

 }catch(e){
  dubStatus.innerText='Erro na dublagem: '+e; pararDublagem();
 }
}

function pararDublagem(){
 dubLigado=false; clearInterval(timerDub); window.speechSynthesis.cancel();
 let btn=document.getElementById('btnDUB'); if(btn){ btn.innerText='🇧🇷 DUBLAR LEGENDA EM PORTUGUÊS'; btn.classList.remove('parar'); }
}

document.getElementById('file').addEventListener('change', async e=>{
 for(let file of e.target.files){
  await new Promise(res=>{ let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').add({nome:file.name, tipo:'mp4', videoId:'', thumb:'', blob:file}); tx.oncomplete=res; });
 }
 location.reload();
});
</script>
</body>
</html>
